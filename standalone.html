<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>志愿通 · 高考志愿信息检索平台</title>
<style>
/* ============================================================
   志愿通 · 全局样式
   ============================================================ */

:root{
  --brand:#2B6CF6;
  --brand-dark:#1B51D0;
  --brand-soft:#EBF1FE;
  --teal:#0FA3A3;
  --teal-soft:#E6F7F7;
  --amber:#E08A00;
  --amber-soft:#FFF4E0;
  --green:#17A673;
  --green-soft:#E6F7F1;
  --red:#DC3D3D;
  --red-soft:#FDECEC;

  --bg:#F5F7FB;
  --surface:#FFFFFF;
  --surface-muted:#F8FAFD;
  --text:#17233A;
  --muted:#667799;
  --border:#E3E9F4;

  --radius-sm:8px;
  --radius:14px;
  --radius-lg:20px;
  --shadow:0 1px 2px rgba(23,35,58,.04), 0 8px 24px rgba(23,35,58,.06);
  --shadow-hover:0 2px 4px rgba(23,35,58,.06), 0 14px 34px rgba(23,35,58,.10);

  --maxw:1180px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font:400 15px/1.65 var(--font);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.35}
p{margin:0}

/* ---------------- 顶部导航 ---------------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:var(--maxw);margin:0 auto;padding:0 20px;
  height:64px;display:flex;align-items:center;gap:24px;
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-mark{
  width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;
}
.brand-text{font-weight:600;font-size:17px;letter-spacing:.5px}

.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{
  padding:8px 14px;border-radius:var(--radius-sm);color:var(--muted);
  font-size:14.5px;white-space:nowrap;transition:background .15s,color .15s;
}
.nav a:hover{background:var(--surface-muted);color:var(--text)}
.nav a.active{background:var(--brand-soft);color:var(--brand-dark);font-weight:500}

.topbar-search{flex:none;width:260px}
.topbar-search input{
  width:100%;height:38px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-muted);padding:0 14px;outline:none;transition:.15s;
}
.topbar-search input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}

/* ---------------- 页面容器 ---------------- */
.app{max-width:var(--maxw);margin:0 auto;padding:28px 20px 64px;min-height:60vh}
.page-head{margin-bottom:22px}
.page-head h1{font-size:26px;margin-bottom:8px}
.page-head p{color:var(--muted);font-size:14.5px;max-width:820px}

/* ---------------- 首页 Hero ---------------- */
.hero{
  background:linear-gradient(180deg,#EEF4FF 0%,var(--bg) 100%);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:44px 36px 40px;text-align:center;margin-bottom:26px;
}
.hero h1{font-size:32px;margin-bottom:12px}
.hero .sub{color:var(--muted);font-size:15.5px;margin-bottom:26px}
.hero-search{max-width:620px;margin:0 auto;display:flex;gap:10px}
.hero-search input{
  flex:1;height:52px;border:1px solid var(--border);border-radius:var(--radius);
  background:#fff;padding:0 18px;outline:none;font-size:15.5px;box-shadow:var(--shadow);
}
.hero-search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn{
  border:0;border-radius:var(--radius);cursor:pointer;font-weight:500;
  padding:0 22px;height:52px;background:var(--brand);color:#fff;transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--brand-dark)}
.btn-sm{height:38px;padding:0 16px;font-size:14px;border-radius:var(--radius-sm)}
.btn-ghost{background:var(--surface-muted);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:#fff;border-color:var(--brand);color:var(--brand-dark)}
.hero-tips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.hero-tips span{font-size:13px;color:var(--muted)}

/* ---------------- 通用卡片 / 网格 ---------------- */
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
}
.card-title{font-size:16px;font-weight:600;margin-bottom:6px}
.card-desc{color:var(--muted);font-size:14px}

.entry{
  display:block;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s,border-color .15s;
}
.entry:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:#CBD8F0}
.entry-icon{
  width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand-dark);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;margin-bottom:14px;
}
.entry h3{font-size:17px;margin-bottom:8px}
.entry p{color:var(--muted);font-size:14px}
.entry .meta{margin-top:12px;font-size:13px;color:var(--teal)}

.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  margin:34px 0 16px;padding-bottom:10px;border-bottom:1px solid var(--border);
}
.section-head h2{font-size:19px}
.section-head .hint{color:var(--muted);font-size:13px}

/* ---------------- 标签 / 徽章 ---------------- */
.tag{
  display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;
  font-size:12.5px;background:var(--brand-soft);color:var(--brand-dark);white-space:nowrap;
}
.tag-teal{background:var(--teal-soft);color:#0B7C7C}
.tag-amber{background:var(--amber-soft);color:#9A6000}
.tag-green{background:var(--green-soft);color:#0E7A54}
.tag-red{background:var(--red-soft);color:#A82B2B}
.tag-plain{background:var(--surface-muted);color:var(--muted)}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}

.badge-985{background:#FDE8E8;color:#B32020}
.badge-211{background:#EAF1FE;color:#1B51D0}
.badge-sy{background:#FFF4E0;color:#9A6000}

/* ---------------- 筛选栏 ---------------- */
.toolbar{
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow);
}
.toolbar input[type=search],.toolbar select{
  height:38px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-muted);padding:0 12px;outline:none;transition:.15s;
}
.toolbar input[type=search]{flex:1;min-width:180px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--brand);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;font-size:14px;color:var(--muted);transition:.15s;
}
.chip:hover{border-color:var(--brand);color:var(--brand-dark)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.result-count{color:var(--muted);font-size:13.5px;margin-left:auto}

/* ---------------- 名词卡片（板块一） ---------------- */
.term-list{display:grid;gap:12px}
.term{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.term-head{
  width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:16px 20px;display:flex;align-items:center;gap:12px;
}
.term-head:hover{background:var(--surface-muted)}
.term-name{font-weight:600;font-size:15.5px;flex:none}
.term-def{color:var(--muted);font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-caret{color:var(--muted);font-size:12px;transition:transform .18s}
.term.open .term-caret{transform:rotate(180deg)}
.term-body{display:none;padding:0 20px 20px;border-top:1px dashed var(--border)}
.term.open .term-body{display:block}
.term-block{margin-top:14px}
.term-block .k{
  font-size:12.5px;color:var(--brand-dark);font-weight:600;letter-spacing:.4px;
  display:inline-block;margin-bottom:4px;
}
.term-block .v{font-size:14.5px;color:var(--text)}
.term-block.pitfall .k{color:var(--red)}
.term-block.pitfall .v{color:#8C3A3A}

/* ---------------- 表格（板块四） ---------------- */
.table-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:auto;max-height:70vh;
}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:1040px}
table.data thead th{
  position:sticky;top:0;z-index:2;background:var(--surface-muted);
  text-align:left;font-weight:600;font-size:13.5px;color:var(--muted);
  padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.data tbody td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:top}
table.data tbody tr{cursor:pointer;transition:background .12s}
table.data tbody tr:hover{background:var(--brand-soft)}
table.data tbody tr:last-child td{border-bottom:0}
td.uname{font-weight:600;font-size:14.5px;white-space:nowrap}
td.nowrap{white-space:nowrap;color:var(--muted)}
td.clamp{max-width:260px;color:var(--muted);font-size:13.5px}

.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px}
.pager button{
  min-width:38px;height:38px;border:1px solid var(--border);background:var(--surface);
  border-radius:var(--radius-sm);cursor:pointer;color:var(--muted);
}
.pager button:hover{border-color:var(--brand);color:var(--brand-dark)}
.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.pager button:disabled{opacity:.4;cursor:default}
.pager .info{color:var(--muted);font-size:13.5px;margin:0 6px}

/* ---------------- 抽屉 / 详情 ---------------- */
.drawer-mask{
  position:fixed;inset:0;background:rgba(23,35,58,.42);z-index:80;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);z-index:81;
  background:var(--surface);box-shadow:-8px 0 40px rgba(23,35,58,.18);
  transform:translateX(102%);transition:transform .24s ease;
  display:flex;flex-direction:column;
}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:22px 24px;border-bottom:1px solid var(--border);position:relative}
.drawer-head h2{font-size:21px;margin-bottom:10px}
.drawer-close{
  position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:var(--surface-muted);cursor:pointer;color:var(--muted);
}
.drawer-close:hover{background:#fff;color:var(--text)}
.drawer-body{padding:20px 24px 40px;overflow:auto}
.drow{padding:13px 0;border-bottom:1px dashed var(--border);display:flex;gap:16px}
.drow:last-child{border-bottom:0}
.drow .dk{flex:none;width:92px;color:var(--muted);font-size:13.5px}
.drow .dv{flex:1;font-size:14.5px}
.note-box{
  margin-top:16px;padding:12px 14px;border-radius:var(--radius-sm);
  background:var(--amber-soft);color:#8A5A00;font-size:13.5px;
}

/* ---------------- 专业热度（板块二） ---------------- */
.major-row{
  display:flex;align-items:center;gap:16px;padding:14px 18px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;transition:.15s;
}
.major-row:hover{border-color:#CBD8F0;box-shadow:var(--shadow-hover)}
.major-name{width:150px;flex:none;font-weight:600;font-size:15px}
.major-cat{width:88px;flex:none;font-size:13px;color:var(--muted)}
.major-bar{flex:1;height:9px;border-radius:999px;background:var(--surface-muted);overflow:hidden;min-width:80px}
.major-bar i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.major-score{width:56px;flex:none;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.major-flags{width:112px;flex:none;display:flex;gap:6px;justify-content:flex-end}

.dir-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);
}
.dir-card h3{font-size:16px;margin-bottom:6px}
.dir-card .heat{font-size:12.5px;color:var(--teal);margin-bottom:10px;display:block}
.dir-card p{font-size:14px;color:var(--muted);margin-bottom:10px}

/* ---------------- AI 表单（板块三） ---------------- */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;color:var(--muted)}
.field input,.field select,.field textarea{
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-muted);
  padding:10px 12px;outline:none;transition:.15s;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);background:#fff}
.field textarea{resize:vertical;min-height:76px}
.out-box{
  white-space:pre-wrap;font-size:13.5px;line-height:1.75;
  background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:16px;max-height:420px;overflow:auto;font-family:ui-monospace,Consolas,Menlo,monospace;
}
.step-hint{display:flex;gap:10px;font-size:13.5px;color:var(--muted);align-items:center;margin-bottom:14px}

/* ---------------- 空状态 ---------------- */
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:12px;opacity:.5}

/* ---------------- 页脚 ---------------- */
.footer{border-top:1px solid var(--border);background:var(--surface);margin-top:40px}
.footer-inner{max-width:var(--maxw);margin:0 auto;padding:28px 20px 40px}
.footer-strong{font-weight:600;font-size:14.5px;margin-bottom:8px}
.footer p{color:var(--muted);font-size:13px;line-height:1.8}
.footer-meta{margin-top:12px;font-size:12.5px;color:#93A0B8}

/* ---------------- 响应式 ---------------- */
@media (max-width:980px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:repeat(2,1fr)}
  .topbar-search{width:180px}
}
@media (max-width:720px){
  .topbar-inner{height:auto;padding:10px 16px;flex-wrap:wrap;gap:10px}
  .nav{order:3;width:100%;flex:1 1 100%}
  .brand-text{display:none}
  .topbar-search{flex:1;width:auto}
  .app{padding:18px 16px 48px}
  .hero{padding:30px 20px;border-radius:var(--radius)}
  .hero h1{font-size:24px}
  .hero-search{flex-direction:column}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .major-row{flex-wrap:wrap;gap:10px}
  .major-name{width:auto}
  .major-cat{width:auto}
  .major-bar{order:5;flex:1 1 100%}
  .term-def{display:none}
}

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/home">
      <span class="brand-mark">志</span>
      <span class="brand-text">志愿通</span>
    </a>

    <nav class="nav" id="nav">
      <a href="#/home" data-route="home">首页</a>
      <a href="#/rules" data-route="rules">规则百科</a>
      <a href="#/majors" data-route="majors">专业与行业</a>
      <a href="#/universities" data-route="universities">院校库</a>
      <a href="#/ai" data-route="ai">AI 志愿建议</a>
    </nav>

    <div class="topbar-search">
      <input id="globalSearch" type="search" placeholder="搜索名词 / 专业 / 院校…" autocomplete="off">
    </div>
  </div>
</header>

<main id="app" class="app"></main>

<footer class="footer">
  <div class="footer-inner">
    <p class="footer-strong">免责声明</p>
    <p>
      本平台所有数据来自各省教育考试院公开文件、阳光高考平台、教育部公示名单及各院校官网的公开资料整理，
      均为<b>参考信息</b>。招生政策、录取分数、专业设置、住宿条件每年可能调整，
      请务必以<b>本省考试院当年发布文件</b>和<b>院校当年招生章程</b>为最终依据。
      本平台不提供任何形式的录取承诺，不替代官方渠道。
    </p>
    <p class="footer-meta">志愿通 · MVP 演示版 · 数据更新日期见各模块标注</p>
  </div>
</footer>








<script>
/* ===== rules.js ===== */
/* 板块一：填报规则与名词解释
   字段说明：
   term 名词 / cat 分类 / def 一句话定义 / plain 通俗解释 / example 举例
   pitfall 易错提醒 / scope 适用范围（"全国" 或 "分省差异"） */
window.GK_RULES = [
  /* ===== 投档规则 ===== */
  {
    id: "pingxing", term: "平行志愿", cat: "投档规则", scope: "全国",
    def: "同一批次内可填多个志愿，投档时按“分数优先、遵循志愿、一轮投档”的规则依次检索。",
    plain: "你可以把一批志愿看成排成一队的几个篮子。系统先把全省考生从高分到低分排队，轮到你时，从你填的第 1 个志愿开始往后看，哪个学校还有名额就投进哪个，投出去就结束，不再看后面的。",
    example: "A 考生填了 45 个院校专业组，系统按第 1、2、3…的顺序检查，直到找到一个还有空位的组，即被投档。",
    pitfall: "很多人误解为“几个志愿同时投”，其实是顺序检索、只投一次。投出去的志愿一旦被退档，后面的志愿也全部作废，只能等征集志愿。"
  },
  {
    id: "shunxu", term: "顺序志愿", cat: "投档规则", scope: "分省差异",
    def: "以“志愿优先”为原则，先把所有填了某一志愿的考生按分数排序，再按计划数投档。",
    plain: "先看你填的是不是第一志愿，学校优先录第一志愿考生；第一志愿没招满，才看第二志愿的考生。所以第一志愿极其关键。",
    example: "某校在某省只招 20 人，若第一志愿上线考生有 30 人，那么第二志愿填它的考生无论分多高都无法被投档。",
    pitfall: "新高考省份多数已改用平行志愿，但提前批、部分特殊类型批次仍可能用顺序志愿，务必看本省当年文件。"
  },
  {
    id: "fenshuyouxian", term: "分数优先（投档）", cat: "投档规则", scope: "全国",
    def: "投档时先按考生总分（含政策性加分后的投档分）从高到低排队，高分者优先被检索。",
    plain: "分数是排队的依据，不是“谁填在前面谁先投”。只有轮到你的位置时，才会开始检索你的志愿。",
    example: "同分的两名考生，会按各省规定的同分排序规则（如语文数学总分、单科成绩等）排出先后。",
    pitfall: "投档分不等于卷面分，可能含政策性加分；同分排序规则各省不同，临界位次一定要查本省规则。"

      if (st.prov !== '全部' && u.province !== st.prov) return false;
      if (st.type !== '全部' && u.type !== st.type) return false;
      if (!kw) return true;
      return norm([u.name, u.province, u.city, u.type, u.featureSubjects, u.topMajors, u.environment, u.note].join(' ')).includes(kw);
    });

  function paintUniversities() {
    const st = UI.unis;
    const list = uniFiltered();
    const total = list.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (st.page > pages) st.page = pages;
    const start = (st.page - 1) * PAGE_SIZE;
    const rows = list.slice(start, start + PAGE_SIZE);

    $('#uniBody').innerHTML = rows.length ? rows.map((u) => `
      <tr data-uni="${esc(u.id || u.name)}">
        <td class="uname">${esc(u.name)}</td>
        <td><div class="tag-row">${uniTags(u)}</div></td>
        <td class="nowrap">${esc(u.province)}</td>

        <td class="clamp">${esc(u.topMajors)}</td>
        <td class="clamp">${esc(u.dorm)}</td>

      : `<tr><td colspan="7"><div class="empty"><div class="big">⌕</div>没有符合条件的院校，试试放宽筛选条件</div></td></tr>`;

    $('#uniCount').textContent = `共 ${total} 所`;

    const btns = [];
    btns.push(`<button type="button" data-page="${st.page - 1}" ${st.page === 1 ? 'disabled' : ''}>‹</button>`);
    const win = 5;
    let s = Math.max(1, st.page - 2), e = Math.min(pages, s + win - 1);
    s = Math.max(1, Math.min(s, pages - win + 1));
    for (let i = s; i <= e; i++) btns.push(`<button type="button" data-page="${i}" class="${i === st.page ? 'on' : ''}">${i}</button>`);
    btns.push(`<button type="button" data-page="${st.page + 1}" ${st.page === pages ? 'disabled' : ''}>›</button>`);
    btns.push(`<span class="info">第 ${st.page} / ${pages} 页</span>`);
    $('#uniPager').innerHTML = pages > 1 ? btns.join('') : '';
  }

  function buildPrompt(v) {
    return `你是一位熟悉中国高考志愿填报规则的升学规划顾问。请基于以下考生信息，给出一份结构化的志愿填报参考建议。

【考生信息】
- 省份：${v.province}
- 科类/选科：${v.ke}
- 高考分数：${v.score}
- 全省位次：${v.rank}
- 意向专业：${v.major || '未明确'}
- 意向职业：${v.job || '未明确'}
- 意向城市：${v.city || '未明确'}
- 意向院校：${v.uni || '未明确'}
- 特别说明：${v.extra || '无'}

【输出要求】
1. 先用「位次法」把该位次换算为往年的等效位次区间，说明换算假设，并提醒我以本省一分一段表为准。
2. 按「冲 / 稳 / 保」三档，分别给出建议的位次区间与院校层次范围，并说明每档大概应安排多少个志愿。
3. 针对我的意向专业，说明该专业常见的选科要求、单科要求与体检限制。
4. 列出我必须在院校招生章程里逐条核对的 5 项内容（如专业级差、服从调剂规则、单科要求、体检要求、转专业政策）。
5. 指出我这份需求中存在的 3 个最大风险点，并给出规避建议。
6. 最后给出 5 个我应该继续追问你的问题。

【硬性约束】
- 不确定的数据必须明确标注「需核实」，不要编造具体录取分数或名次。
- 不得给出任何「保证录取」的表述。
- 全部结论必须以本省考试院当年文件和院校当年招生章程为最终依据。`;
  }

  function localAdvice(v) {
    const s = Number(v.score) || 0;
    const r = Number(v.rank) || 0;
    const band = (a, b) => `位次约 ${Math.max(1, Math.round(r * a)).toLocaleString()} — ${Math.round(r * b).toLocaleString()} 名`;
    return [
      { t: '冲（有机会，但需接受风险）', d: `建议位次区间：比你的位次靠前，约 ${Math.max(1, Math.round(r * 0.55)).toLocaleString()} — ${Math.round(r * 0.9).toLocaleString()} 名。<br>建议占志愿总数的 20%~30%。这一档要用来博更好的院校或专业，同时必须勾选服从调剂。` },
      { t: '稳（把握较大）', d: `建议位次区间：与你接近，约 ${band(0.9, 1.25)}。<br>建议占 40%~50%。这一档是你的主战场，应重点核对专业组内是否有不能接受的专业。` },
      { t: '保（兜底，必须能走）', d: `建议位次区间：明显低于你的位次，约 ${band(1.25, 2.2)}。<br>建议占 30% 左右，且最后 1~2 个志愿要确保绝对能录取，避免滑档。` },
      { t: '必查清单（5 项）', d: '① 是否有专业级差；② 服从调剂的具体范围；③ 单科成绩要求（英语/数学）；④ 体检与色盲色弱限制；⑤ 转专业与大类分流的规则。' },
      { t: '你当前信息里的主要风险', d: (v.major || v.city || v.uni)
        ? `你填写了意向（专业：${esc(v.major) || '—'}；城市：${esc(v.city) || '—'}；院校：${esc(v.uni) || '—'}），这属于<b>强意向</b>。强意向最容易导致志愿集中、梯度不足，建议保留至少 30% 不设意向限制的志愿作为保底。`
        : '你尚未填写专业、城市或院校意向。意向过宽会导致排序困难，建议先确定 2~3 个优先方向，再排梯度。' },
      { t: '免责说明', d: '以上为基于位次区间的通用框架，<b>不是录取概率预测</b>，也未使用本省历年录取数据。最终请以本省考试院文件和院校招生章程为准。' }
    ];
  }

  function aiGenerate() {
    const v = {
      province: $('#aiProv').value, ke: $('#aiKe').value,
      score: $('#aiScore').value.trim(), rank: $('#aiRank').value.trim(),
      major: $('#aiMajor').value.trim(), job: $('#aiJob').value.trim(),
      city: $('#aiCity').value.trim(), uni: $('#aiUni').value.trim(),
      extra: $('#aiExtra').value.trim()
    };
    const missing = [];
    if (!v.province) missing.push('省份');
    if (!v.ke) missing.push('科类/选科');
    if (!v.score) missing.push('高考分数');
    if (!v.rank) missing.push('全省位次');
    if (missing.length) {
      $('#aiResultCard').style.display = 'block';
      $('#aiResult').innerHTML = `<div class="note-box">请先填写：${esc(missing.join('、'))}。位次是最关键的字段，请务必填写。</div>`;
      $('#aiPrompt').textContent = '';
      return;
    }
    $('#aiResultCard').style.display = 'block';
    $('#aiResult').innerHTML = localAdvice(v).map((b) => `
      <div class="card" style="box-shadow:none">
        <div class="card-title">${esc(b.t)}</div>
        <p class="card-desc">${b.d}</p>
      </div>`).join('');
    $('#aiPrompt').textContent = buildPrompt(v);
  }

  async function aiCall() {
    const url = $('#apiUrl').value.trim();
    const key = $('#apiKey').value.trim();
    const model = $('#apiModel').value.trim();
    const box = $('#aiAnswer');
    box.style.display = 'block';
    if (!url || !key || !model) { box.textContent = '请先完整填写 API 地址、模型名称和 API Key。'; return; }
    const prompt = $('#aiPrompt').textContent;
    if (!prompt) { box.textContent = '请先点击上方「生成参考建议」，让系统准备好提问模板。'; return; }
    box.textContent = '正在请求模型…';
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: 'system', content: '你是一位严谨的中国高考志愿填报顾问，不编造数据，不承诺录取。' },
            { role: 'user', content: prompt }
          ],
          temperature: 0.3
        })
      });
      const data = await res.json();
      const text = data && data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content
        : JSON.stringify(data).slice(0, 1200);
      box.textContent = text;
    } catch (err) {
      box.textContent = '请求失败：' + (err && err.message ? err.message : String(err))
        + '\n\n提示：浏览器直接调用第三方 API 可能被跨域（CORS）拦截。若失败，请改用上面的「复制提问模板」，粘贴到对应大模型的对话框中使用。';
    }
  }

  /* ---------------- 全局搜索 ---------------- */
  function viewSearch(q) {
    const kw = norm(q);
    const rl = RULES.filter((t) => norm([t.term, t.def, t.plain, t.cat].join(' ')).includes(kw)).slice(0, 8);
    const mj = MAJORS.filter((m) => norm([m.name, m.cat, m.desc].join(' ')).includes(kw)).slice(0, 8);
    const un = UNIS.filter((u) => norm([u.name, u.province, u.city, u.type, u.featureSubjects, u.topMajors, u.note].join(' ')).includes(kw)).slice(0, 12);
    const total = rl.length + mj.length + un.length;
    return `
    <div class="page-head">
      <h1>搜索「${esc(q)}」</h1>
      <p>共找到 ${total} 条结果${total === 0 ? '，换个关键词试试' : ''}。</p>
    </div>
    ${!total ? `<div class="empty"><div class="big">⌕</div>没有找到相关内容</div>` : ''}
    ${rl.length ? `
      <div class="section-head"><h2>规则与名词</h2><span class="hint">${rl.length} 条</span></div>
      <div class="term-list">${rl.map((t) => ruleCard(t, false)).join('')}</div>` : ''}
    ${mj.length ? `
      <div class="section-head"><h2>专业与行业</h2><span class="hint">${mj.length} 条</span></div>
      <div class="grid grid-2">${mj.map((m) => `
        <div class="card"><div class="card-title">${esc(m.name)}</div>
        <div class="tag-row" style="margin:8px 0"><span class="tag tag-plain">${esc(m.cat)}</span><span class="tag">热度 ${esc(m.heat)}</span></div>
        <p class="card-desc">${esc(m.desc)}</p></div>`).join('')}</div>` : ''}
    ${un.length ? `
      <div class="section-head"><h2>院校</h2><span class="hint">${un.length} 所（最多显示 12 所）</span></div>
      <div class="grid grid-3">${un.map((u) => `
        <a class="card" href="#/universities" data-jump-uni="${esc(u.id || u.name)}">
          <div class="card-title">${esc(u.name)}</div>
          <div class="tag-row" style="margin:8px 0">${uniTags(u)}<span class="tag tag-plain">${esc(u.province)}</span></div>
          <p class="card-desc">${esc(u.topMajors)}</p></a>`).join('')}</div>` : ''}`;
  }

  /* ---------------- 路由 ---------------- */
  const RENDERERS = {
    home: viewHome, rules: viewRules, majors: viewMajors,
    universities: viewUniversities, ai: viewAI
  };

  function route() {
    const raw = location.hash.replace(/^#\/?/, '') || 'home';
    const [path, qs] = raw.split('?');
    const params = new URLSearchParams(qs || '');
    const name = RENDERERS[path] ? path : 'home';

    if (path === 'search') {
      $('#app').innerHTML = viewSearch(params.get('q') || '');
    } else {
      $('#app').innerHTML = RENDERERS[name]();
    }

    document.querySelectorAll('#nav a').forEach((a) => {
      a.classList.toggle('active', a.dataset.route === (path === 'search' ? '' : name));
    });

    if (name === 'rules' && path !== 'search') paintRules();
    if (name === 'majors' && path !== 'search') paintMajors();
    if (name === 'universities' && path !== 'search') paintUniversities();
    if (path === 'search') {
      const q = params.get('q') || '';
      const gs = $('#globalSearch'); if (gs) gs.value = q;
    }
    window.scrollTo(0, 0);
  }

  /* ---------------- 事件绑定 ---------------- */
  function bind() {
    document.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (chip) {
        const box = chip.parentElement;
        box.querySelectorAll('.chip').forEach((c) => c.classList.remove('on'));
        chip.classList.add('on');
        if (box.id === 'ruleCats') { UI.rules.cat = chip.dataset.cat; paintRules(); }
        if (box.id === 'majorLevels') { UI.majors.level = chip.dataset.lv; paintMajors(); }
        if (box.id === 'uniTags') { UI.unis.tag = chip.dataset.tag; UI.unis.page = 1; paintUniversities(); }
        return;
      }

      const head = e.target.closest('.term-head');
      if (head) { head.parentElement.classList.toggle('open'); return; }

      const mrow = e.target.closest('.major-row');
      if (mrow) { openMajor(mrow.dataset.major); return; }

      const urow = e.target.closest('tr[data-uni]');
      if (urow) { openUni(urow.dataset.uni); return; }

      const jump = e.target.closest('[data-jump-uni]');
      if (jump) {
        const key = jump.dataset.jumpUni;
        setTimeout(() => {
          const row = document.querySelector(`tr[data-uni="${key}"]`);
          if (row) { openUni(key); } else { openUni(key); }
        }, 60);
        return;
      }

      const pbtn = e.target.closest('#uniPager button[data-page]');
      if (pbtn && !pbtn.disabled) {
        UI.unis.page = Number(pbtn.dataset.page) || 1;
        paintUniversities();
        document.querySelector('.table-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }

      if (e.target.id === 'drawerMask' || e.target.closest('#drawerClose')) { closeUni(); return; }
      if (e.target.id === 'aiGen') { aiGenerate(); return; }
      if (e.target.id === 'aiCall') { aiCall(); return; }
      if (e.target.id === 'aiClear') {
        ['aiScore', 'aiRank', 'aiMajor', 'aiJob', 'aiCity', 'aiUni', 'aiExtra'].forEach((id) => { $('#' + id).value = ''; });
        $('#aiProv').value = ''; $('#aiKe').value = '';
        $('#aiResultCard').style.display = 'none'; $('#aiAnswer').style.display = 'none';
        return;
      }
      if (e.target.id === 'aiCopy') {
        const btn = e.target;
        const box = $('#aiPrompt');
        const txt = box.textContent;
        const reset = () => { btn.textContent = '复制提问模板'; };
        const done = () => { btn.textContent = '已复制 ✓'; setTimeout(reset, 1600); };
        const selectAll = () => {
          const r = document.createRange();
          r.selectNodeContents(box);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
          btn.textContent = '已全选，请按 Ctrl+C';
          setTimeout(reset, 2400);
        };
        const legacy = () => {
          const ta = document.createElement('textarea');
          ta.value = txt;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
          document.body.removeChild(ta);
          if (ok) done(); else selectAll();
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(done, legacy);
        } else {
          legacy();
        }
        return;
      }
      if (e.target.id === 'heroSearchBtn') {
        const q = $('#heroSearch').value.trim();
        if (q) location.hash = '#/search?q=' + encodeURIComponent(q);
        return;
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (e.target.id === 'globalSearch' || e.target.id === 'heroSearch') {
        const q = e.target.value.trim();
        if (q) location.hash = '#/search?q=' + encodeURIComponent(q);
      }
    });

    let timer = null;
    document.addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'ruleSearch' || id === 'uniSearch') {
        clearTimeout(timer);
        timer = setTimeout(() => {
          if (id === 'ruleSearch') { UI.rules.q = e.target.value; paintRules(); }
          else { UI.unis.q = e.target.value; UI.unis.page = 1; paintUniversities(); }
        }, 160);
      }
    });

    document.addEventListener('change', (e) => {
      if (e.target.id === 'uniProv') { UI.unis.prov = e.target.value; UI.unis.page = 1; paintUniversities(); }
      if (e.target.id === 'uniType') { UI.unis.type = e.target.value; UI.unis.page = 1; paintUniversities(); }
    });

    window.addEventListener('hashchange', route);
  }

  function openMajor(name) {
    const m = MAJORS.find((x) => x.name === name);
    if (!m) return;
    const lvTag = m.level === '绿牌' ? 'tag-green' : m.level === '红牌' ? 'tag-red' : 'tag-amber';
    const row = (k, v) => `<div class="drow"><span class="dk">${esc(k)}</span><span class="dv">${esc(v || '暂无公开数据')}</span></div>`;
    $('#drawerHead').innerHTML = `
      <h2>${esc(m.name)}</h2>
      <div class="tag-row">
        <span class="tag tag-plain">${esc(m.cat)}</span>
        <span class="tag ${lvTag}">${esc(m.level)}</span>
        <span class="tag">热度 ${esc(m.heat)}</span>
        <span class="tag tag-plain">趋势：${esc(m.trend)}</span>
      </div>
      <button class="drawer-close" id="drawerClose" type="button">✕</button>`;
    $('#drawerBody').innerHTML = `
      ${row('专业简介', m.desc)}
      ${row('薪酬参考', m.salary)}
      ${row('典型岗位', (m.jobs || []).join('、'))}
      <div class="note-box">热度指数与薪酬为公开资料综合整理的参考值，仅供了解趋势，请以官方与招生章程为准。</div>`;
    $('#drawer').classList.add('show');
    $('#drawerMask').classList.add('show');
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    if (!document.getElementById('drawer')) {
      const wrap = document.createElement('div');
      wrap.innerHTML = `
        <div class="drawer-mask" id="drawerMask"></div>
        <aside class="drawer" id="drawer">
          <div class="drawer-head" id="drawerHead"></div>
          <div class="drawer-body" id="drawerBody"></div>
        </aside>`;
      document.body.appendChild(wrap);
    }
    bind();
    route();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
